<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — CASTA GLB</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dp8qpqog1/image/upload/q_auto/f_auto/v1781820683/favicon_2_fk2m9t.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #000000;
      --black2: #0d0d0d;
      --gold: #C9A84C;
      --white: #F5F5F5;
      --white2: #d0d0d0;
      --gray: #555555;
      --font-display: 'Bebas Neue', serif;
      --font-body: 'Jost', sans-serif;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-body);
      font-weight: 300;
      line-height: 1.8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 5vw;
      text-align: center;
    }

    .notfound-container {
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .notfound-code {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(6rem, 22vw, 11rem);
      line-height: 0.9;
      letter-spacing: 0.04em;
      color: var(--gold);
      position: relative;
      margin-bottom: 0.5rem;
    }

    .notfound-line {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 1.5rem 0;
      opacity: 0.6;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: var(--white);
      font-weight: 300;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .notfound-text {
      color: var(--white2);
      font-size: 0.95rem;
      font-weight: 300;
      max-width: 420px;
      margin-bottom: 2.75rem;
    }

    .notfound-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 2.2rem;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--black);
      border: 1px solid var(--gold);
    }
    .btn-primary:hover {
      background: transparent;
      color: var(--gold);
    }

    .btn-secondary {
      background: transparent;
      color: var(--white2);
      border: 1px solid var(--gray);
    }
    .btn-secondary:hover {
      color: var(--white);
      border-color: var(--white2);
    }
  </style>
</head>
<body>
  <div class="notfound-container">
    <div class="notfound-code">404</div>
    <div class="notfound-line"></div>
    <h1>Esta página no existe</h1>
    <p class="notfound-text">
      Puede que el enlace esté roto o que la página haya sido movida.
      Volvé al inicio o explorá el catálogo para seguir viendo.
    </p>
    <div class="notfound-actions">
      <a href="/" class="btn-primary">Ir al inicio</a>
      <a href="/catalogo" class="btn-secondary">Ver catálogo</a>
    </div>
  </div>
</body>
</html>
