name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta todos los días a las 05:00 AM y 17:00 PM UTC
    - cron: '0 5,17 * * *'
  workflow_dispatch: # Permite probarlo manualmente

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer consulta a Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Limpiamos la URL por si termina en '/'
          CLEAN_URL="${URL%/}"
          echo "URL limpia: ${CLEAN_URL}"
          
          # Hacemos la consulta al Schema OpenAPI de PostgREST
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${CLEAN_URL}/rest/v1/" \
          -H "apikey: ${KEY}" \
          -H "Authorization: Bearer ${KEY}")
          
          echo "Supabase respondió con el código HTTP: $STATUS"
          
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Conexión exitosa. La base de datos sigue activa."
          else
            echo "Error: La API devolvió el código $STATUS."
            echo "Revisa que SUPABASE_URL y SUPABASE_ANON_KEY estén bien cargados en los Secrets de GitHub."
            exit 1
          fi
