name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta todos los días a las 05:00 AM UTC y 17:00 PM UTC
    - cron: '0 5,17 * * *'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer consulta a Supabase
        run: |
          curl --fail -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            > /dev/null
          echo "Ping realizado con éxito a Supabase"
